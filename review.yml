sources:
  - url: https://www.cudocompute.com/docs/api
    type: Documentation
    note: API introduction; resource-oriented HTTPS REST, base URL https://rest.compute.cudo.org, v1 surface.
  - url: https://www.cudocompute.com/docs/rest-api/introduction
    type: APIReference
    note: Authentication via Bearer API key in Authorization header; 401 UNAUTHENTICATED on missing key.
  - url: https://github.com/CudoVentures/cudo-compute-python-client
    type: SDK
    note: Generated client; swagger/compute.swagger.json defines host rest.compute.cudo.org and 97 v1 REST paths. Clients are swagger-codegen generated, indicating a gRPC/protobuf-backed gateway.
  - url: https://pypi.org/project/cudo-compute/
    type: SDK
    note: Official cudo-compute Python client on PyPI.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No streaming protocol surface exists. The provider documents a REST API
    (modeled in openapi/cudo-compute-openapi.yml) plus a parallel gRPC API.
    No AsyncAPI document was authored because no WebSocket or SSE interface is
    documented.
