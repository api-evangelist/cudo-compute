aid: cudo-compute
name: CUDO Compute
review:
  question: Does CUDO Compute expose a documented public streaming (WebSocket/SSE) API?
  answer: false
  date: '2026-06-21'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was created. CUDO Compute is a control-plane
    infrastructure provider. It documents a synchronous REST API and a
    parallel gRPC API for the same services. No public WebSocket (ws://,
    wss://) or HTTP Server-Sent Events (SSE) streaming surface is documented,
    so there is no event-driven/streaming interface in scope for AsyncAPI
    modeling as of the review date.
findings:
  summary: |
    CUDO Compute publishes a versioned, resource-oriented REST API at
    https://rest.compute.cudo.org (v1) that provisions and manages virtual
    machines, machine types, GPU models, data centers, disks and snapshots,
    networks and security groups, images, SSH keys, object storage, projects,
    permissions, API keys, and billing. The same capabilities are also exposed
    via a gRPC API (the published clients are generated from a protobuf/gRPC
    contract; the REST surface is the gRPC-gateway JSON transcoding). All REST
    endpoints speak JSON over HTTPS and authenticate with a Bearer API key in
    the Authorization header; missing or invalid keys return 401
    UNAUTHENTICATED. No documented WebSocket or SSE streaming endpoint exists.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://rest.compute.cudo.org
      documented: true
    - protocol: gRPC
      scheme: grpc
      note: Parallel gRPC API exposing the same Cudo Compute services; the REST surface is its JSON/HTTP transcoding via grpc-gateway. Generated clients are published (e.g. Python, Go).
      documented: true
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented in the CUDO Compute API reference as of the review date.
    - protocol: SSE
      scheme: https
      documented: false
      note: No Server-Sent Events streaming endpoint is documented.
