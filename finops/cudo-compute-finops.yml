description: >-
  FinOps view of CUDO Compute spend. CUDO bills usage-based, per-resource-hour
  rates: per GPU-hour (by GPU model and data center), per vCPU-hour, per GiB of
  memory-hour, per GiB of storage, plus public IP and network charges. Reserved
  Capacity and committed contracts lower effective rates; bare metal and cluster
  capacity is priced by quote. The Billing API exposes spend details, invoices,
  outstanding balances, credit balances, and per-account hourly/monthly spend
  limits for cost governance.
notes: >-
  Per-GPU and per-resource rates vary by data center and change over time;
  verify against the live machine-type-prices endpoint and the pricing page
  during reconciliation.
sources:
- https://www.cudocompute.com/pricing
- https://www.cudocompute.com/docs/api
