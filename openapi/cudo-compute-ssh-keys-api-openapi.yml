openapi: 3.2.0
info:
  description: The CUDO Compute API is organized around REST. Our API uses predictable resource-oriented URLs, accepts and returns JSON-encoded requests and responses, and uses standard HTTP response codes, authentication, and verbs where possible.
  title: CUDO Compute service SSH keys API
  version: 1.0.0
servers:
- url: https://rest.compute.cudo.org/
security:
- bearerAuth: []
tags:
- description: SSH keys are access credentials that are automatically added to bare-metal and virtual machines you create.
  name: SSH Keys
paths:
  /v1/ssh-keys:
    get:
      description: Lists the SSH keys of the current user.
      operationId: ListSshKeys
      parameters:
      - in: query
        name: pageNumber
        schema:
          format: int32
          type: integer
      - in: query
        name: pageSize
        schema:
          format: int32
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSshKeysResponse'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
          description: An unexpected error response.
      summary: List SSH keys
      tags:
      - SSH Keys
    post:
      description: Creates an SSH key that can be used to access bare-metal and virtual machines.
      operationId: CreateSshKey
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SshKey'
        description: Create SSH key params
        required: true
        x-originalParamName: sshKey
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SshKey'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
          description: An unexpected error response.
      summary: Create an SSH key
      tags:
      - SSH Keys
  /v1/ssh-keys/{id}:
    delete:
      description: Deletes an SSH key. This will not remove the SSH key from existing bare-metal and virtual machines.
      operationId: DeleteSshKey
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
          description: An unexpected error response.
      summary: Delete an SSH key
      tags:
      - SSH Keys
    get:
      description: Retrieves the details of an SSH key.
      operationId: GetSshKey
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SshKey'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
          description: An unexpected error response.
      summary: Get an SSH key
      tags:
      - SSH Keys
components:
  schemas:
    Any:
      additionalProperties: {}
      properties:
        '@type':
          type: string
      type: object
    ListSshKeysResponse:
      properties:
        pageNumber:
          format: int32
          type: integer
        pageSize:
          format: int32
          type: integer
        sshKeys:
          items:
            $ref: '#/components/schemas/SshKey'
          type: array
        totalCount:
          format: int32
          type: integer
      required:
      - sshKeys
      - totalCount
      - pageNumber
      - pageSize
      type: object
    SshKey:
      properties:
        comment:
          readOnly: true
          type: string
        createTime:
          format: date-time
          readOnly: true
          type: string
        fingerprint:
          readOnly: true
          type: string
        id:
          readOnly: true
          type: string
        publicKey:
          type: string
        type:
          readOnly: true
          type: string
      required:
      - publicKey
      type: object
    Status:
      properties:
        code:
          format: int32
          type: integer
        details:
          items:
            $ref: '#/components/schemas/Any'
          type: array
        message:
          type: string
      type: object
  securitySchemes:
    bearerAuth:
      description: API key authentication. API keys should be passed using the format `Bearer API_KEY`.
      in: header
      name: Authorization
      type: apiKey
x-provenance:
  method: harvested
  publisher: CUDO Compute
  source: https://docs.cudocompute.com/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
