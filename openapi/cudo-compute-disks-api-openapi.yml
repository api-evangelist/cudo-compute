openapi: 3.2.0
info:
  description: The CUDO Compute API is organized around REST. Our API uses predictable resource-oriented URLs, accepts and returns JSON-encoded requests and responses, and uses standard HTTP response codes, authentication, and verbs where possible.
  title: CUDO Compute service Disks API
  version: 1.0.0
servers:
- url: https://rest.compute.cudo.org/
security:
- bearerAuth: []
tags:
- description: 'Storage disks are virtual disks that operate just like physical disks. You can attach & detach created storage disks to and from virtual machines in the same data center.


    Related guide: Disks'
  name: Disks
paths:
  /v1/projects/{projectId}/disks:
    get:
      description: Lists virtual machine disks in a project.
      operationId: ListDisks
      parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
      - in: query
        name: pageNumber
        schema:
          format: int32
          type: integer
      - in: query
        name: pageSize
        schema:
          format: int32
          type: integer
      - in: query
        name: dataCenterId
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDisksResponse'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
          description: An unexpected error response.
      summary: List disks
      tags:
      - Disks
    post:
      description: Creates a new virtual machine disk.
      operationId: CreateStorageDisk
      parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                createTime:
                  format: date-time
                  readOnly: true
                  type: string
                dataCenterId:
                  type: string
                diskState:
                  $ref: '#/components/schemas/DiskState'
                diskType:
                  $ref: '#/components/schemas/DiskType'
                id:
                  type: string
                privateImageId:
                  readOnly: true
                  type: string
                publicImageId:
                  readOnly: true
                  type: string
                sizeGib:
                  format: int32
                  type: integer
                vmId:
                  readOnly: true
                  type: string
              required:
              - id
              - dataCenterId
              - sizeGib
              title: Create disk params
              type: object
        description: Create disk params
        required: true
        x-originalParamName: disk
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
          description: An unexpected error response.
      summary: Create a disk
      tags:
      - Disks
  /v1/projects/{projectId}/disks/{id}:
    delete:
      description: Deletes a virtual machine disk. The disk must be detached from any virtual machines before it can be deleted.
      operationId: DeleteStorageDisk
      parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
          description: An unexpected error response.
      summary: Delete a disk
      tags:
      - Disks
    get:
      description: Retrieves the details of a virtual machine disk.
      operationId: GetDisk
      parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDiskResponse'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
          description: An unexpected error response.
      summary: Get a disk
      tags:
      - Disks
  /v1/projects/{projectId}/vms/{id}/disks:
    patch:
      description: Resizes a disk attached to a virtual machine. The new size must be larger than the current size.
      operationId: ResizeVMDisk
      parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: query
        name: diskId
        schema:
          type: string
      - in: query
        name: sizeGib
        schema:
          format: int32
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
          description: An unexpected error response.
      summary: Resize a virtual machine disk
      tags:
      - Disks
components:
  schemas:
    Disk:
      properties:
        createTime:
          format: date-time
          readOnly: true
          type: string
        dataCenterId:
          type: string
        diskState:
          $ref: '#/components/schemas/DiskState'
        diskType:
          $ref: '#/components/schemas/DiskType'
        id:
          type: string
        privateImageId:
          readOnly: true
          type: string
        projectId:
          type: string
        publicImageId:
          readOnly: true
          type: string
        sizeGib:
          format: int32
          type: integer
        vmId:
          readOnly: true
          type: string
      required:
      - id
      - projectId
      - dataCenterId
      - sizeGib
      type: object
    DiskState:
      default: UNKNOWN
      enum:
      - UNKNOWN
      - ATTACHED
      - CLONING
      - CREATING
      - DELETING
      - DISABLED
      - FAILED
      - READY
      - UPDATING
      type: string
    GetDiskResponse:
      properties:
        disk:
          $ref: '#/components/schemas/Disk'
      type: object
    Status:
      properties:
        code:
          format: int32
          type: integer
        details:
          items:
            $ref: '#/components/schemas/Any'
          type: array
        message:
          type: string
      type: object
    ListDisksResponse:
      properties:
        disks:
          items:
            $ref: '#/components/schemas/Disk'
          type: array
        pageNumber:
          format: int32
          type: integer
        pageSize:
          format: int32
          type: integer
        totalCount:
          format: int32
          type: integer
      required:
      - totalCount
      - pageNumber
      - pageSize
      type: object
    Any:
      additionalProperties: {}
      properties:
        '@type':
          type: string
      type: object
    DiskType:
      default: DISK_TYPE_UNKNOWN
      enum:
      - DISK_TYPE_UNKNOWN
      - DISK_TYPE_BOOT
      - DISK_TYPE_STORAGE
      type: string
  securitySchemes:
    bearerAuth:
      description: API key authentication. API keys should be passed using the format `Bearer API_KEY`.
      in: header
      name: Authorization
      type: apiKey
x-provenance:
  method: harvested
  publisher: CUDO Compute
