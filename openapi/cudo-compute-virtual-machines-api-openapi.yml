openapi: 3.2.0
info:
  description: The CUDO Compute API is organized around REST. Our API uses predictable resource-oriented URLs, accepts and returns JSON-encoded requests and responses, and uses standard HTTP response codes, authentication, and verbs where possible.
  title: CUDO Compute service Virtual machines API
  version: 1.0.0
servers:
- url: https://rest.compute.cudo.org/
security:
- bearerAuth: []
tags:
- description: 'A virtual machine (VM) is a software emulation of a physical computer.


    Related guide: Virtual machines'
  name: Virtual machines
paths:
  /v1/projects/{projectId}/count-vms:
    get:
      description: Returns the total number of virtual machines in a project.
      operationId: CountVMs
      parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountVMsResponse'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
          description: An unexpected error response.
      summary: Count virtual machines in a project
      tags:
      - Virtual machines
  /v1/projects/{projectId}/disk/{id}/attach:
    patch:
      description: Attaches a virtual machine disk to a virtual machine.
      operationId: AttachStorageDisk
      parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: query
        name: vmId
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
          description: An unexpected error response.
      summary: Attach a disk to a virtual machine
      tags:
      - Virtual machines
  /v1/projects/{projectId}/disk/{id}/detach:
    put:
      description: Detaches a virtual machine disk from a virtual machine.
      operationId: DetachStorageDisk
      parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
          description: An unexpected error response.
      summary: Detach a disk from a virtual machine
      tags:
      - Virtual machines
  /v1/projects/{projectId}/vm:
    post:
      description: Creates and starts a new virtual machine.
      operationId: CreateVM
      parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVMBody'
        required: true
        x-originalParamName: body
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateVMResponse'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
          description: An unexpected error response.
      summary: Create a virtual machine
      tags:
      - Virtual machines
  /v1/projects/{projectId}/vm/{id}/authorized-ssh-keys:
    post:
      description: Updates the authorized SSH keys of a virtual machine.
      operationId: UpdateVMAuthorizedSSHKeys
      parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVMAuthorizedSSHKeysBody'
        required: true
        x-originalParamName: body
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
          description: An unexpected error response.
      summary: Update virtual machine authorized SSH keys
      tags:
      - Virtual machines
  /v1/projects/{projectId}/vm/{id}/commit:
    post:
      description: Commits a virtual machine to a longer-term plan in exchange for a lower hourly rate. The virtual machine must not already be in a committed term.
      operationId: CommitVM
      parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitVMBody'
        required: true
        x-originalParamName: body
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
          description: An unexpected error response.
      summary: Purchase a commitment for a virtual machine
      tags:
      - Virtual machines
  /v1/projects/{projectId}/vm/{id}/expire-time:
    post:
      description: Updates the expiration time of a virtual machine. The virtual machine will be automatically deleted when it reaches its expiration time.
      operationId: UpdateVMExpireTime
      parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVMExpireTimeBody'
        required: true
        x-originalParamName: body
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateVMExpireTimeResponse'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
          description: An unexpected error response.
      summary: Update virtual machine expiration time
      tags:
      - Virtual machines
  /v1/projects/{projectId}/vm/{id}/metadata:
    post:
      description: Updates the metadata of a virtual machine.
      operationId: UpdateVMMetadata
      parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVMMetadataBody'
        required: true
        x-originalParamName: body
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateVMMetadataResponse'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
          description: An unexpected error response.
      summary: Update virtual machine metadata
      tags:
      - Virtual machines
  /v1/projects/{projectId}/vm/{id}/password:
    post:
      description: Updates the root or administrator password of a virtual machine.
      operationId: UpdateVMPassword
      parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVMPasswordBody'
        required: true
        x-originalParamName: body
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
          description: An unexpected error response.
      summary: Update virtual machine password
      tags:
      - Virtual machines
  /v1/projects/{projectId}/vm/{id}/security-group/attach:
    patch:
      description: Attaches a security group to a virtual machine.
      operationId: AttachSecurityGroup
      parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: query
        name: securityGroupId
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
          description: An unexpected error response.
      summary: Attach a security group to a virtual machine
      tags:
      - Virtual machines
  /v1/projects/{projectId}/vm/{id}/security-group/detach:
    patch:
      description: Detaches a security group from a virtual machine.
      operationId: DetachSecurityGroup
      parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: query
        name: securityGroupId
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
          description: An unexpected error response.
      summary: Detach a security group from a virtual machine
      tags:
      - Virtual machines
  /v1/projects/{projectId}/vms:
    get:
      description: Lists all virtual machines in a project.
      operationId: ListVMs
      parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
      - in: query
        name: networkId
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListVMsResponse'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
          description: An unexpected error response.
      summary: List virtual machines
      tags:
      - Virtual machines
  /v1/projects/{projectId}/vms/{id}:
    get:
      description: Retrieves the details of a virtual machine.
      operationId: GetVM
      parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetVMResponse'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
          description: An unexpected error response.
      summary: Get a virtual machine
      tags:
      - Virtual machines
  /v1/projects/{projectId}/vms/{id}/connect:
    get:
      description: Provides a URL and token to connect to the virtual machine via a web-based VNC console.
      operationId: ConnectVM
      parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: query
        name: connectionId
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectVMResponse'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
          description: An unexpected error response.
      summary: Connect to a virtual machine
      tags:
      - Virtual machines
  /v1/projects/{projectId}/vms/{id}/monitor:
    get:
      description: Returns live monitoring metrics for a virtual machine.
      operationId: MonitorVM
      parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitorVMResponse'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
          description: An unexpected error response.
      summary: Monitor a virtual machine
      tags:
      - Virtual machines
  /v1/projects/{projectId}/vms/{id}/reboot:
    post:
      description: Performs a soft reboot of a virtual machine. The operating system is instructed to reboot. If the OS does not respond, use StopVM and then StartVM.
      operationId: RebootVM
      parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
          description: An unexpected error response.
      summary: Reboot a virtual machine
      tags:
      - Virtual machines
  /v1/projects/{projectId}/vms/{id}/resize:
    post:
      description: Resizes a virtual machine. The size of the virtual machine cannot be reduced while it is in a committed term.
      operationId: ResizeVM
      parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: query
        name: vcpus
        schema:
          format: int64
          type: integer
      - in: query
        name: memoryGib
        schema:
          format: int64
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResizeVMResponse'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
          description: An unexpected error response.
      summary: Resize a virtual machine
      tags:
      - Virtual machines
  /v1/projects/{projectId}/vms/{id}/start:
    post:
      description: Starts a stopped virtual machine.
      operationId: StartVM
      parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
          description: An unexpected error response.
      summary: Start a virtual machine
      tags:
      - Virtual machines
  /v1/projects/{projectId}/vms/{id}/stop:
    post:
      description: Stops a running virtual machine. The virtual machine can be started again later.
      operationId: StopVM
      parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
          description: An unexpected error response.
      summary: Stop a virtual machine
      tags:
      - Virtual machines
  /v1/projects/{projectId}/vms/{id}/terminate:
    post:
      description: Permanently deletes a virtual machine. All data on the virtual machine's boot disk will be lost. Any attached storage disks will be detached but not deleted.
      operationId: TerminateVM
      parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
          description: An unexpected error response.
      summary: Delete a virtual machine
      tags:
      - Virtual machines
  /v1/vms/data-centers:
    get:
      description: Lists all data centers available for virtual machines.
      operationId: ListVMDataCenters
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListVMDataCentersResponse'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
          description: An unexpected error response.
      summary: List virtual machine data centers
      tags:
      - Virtual machines
  /v1/vms/data-centers/{dataCenterId}/machine_types/{machineTypeId}:
    get:
      description: Retrieves the details of a virtual machine type.
      operationId: GetVMMachineType
      parameters:
      - in: path
        name: dataCenterId
        required: true
        schema:
          type: string
      - in: path
        name: machineTypeId
        required: true
        schema:
          type: string
      - description: Return custom prices for a specific project.
        in: query
        name: projectId
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetVMMachineTypeResponse'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
          description: An unexpected error response.
      summary: Get a virtual machine type
      tags:
      - Virtual machines
  /v1/vms/gpu-models:
    get:
      description: Lists all GPU models available for virtual machines.
      operationId: ListVMGpuModels
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListVMGpuModelsResponse'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
          description: An unexpected error response.
      summary: List virtual machine GPU models
      tags:
      - Virtual machines
  /v1/vms/machine-types:
    get:
      description: Lists all virtual machine types available.
      operationId: ListVMMachineTypes
      parameters:
      - description: Return custom prices for a specific project.
        in: query
        name: projectId
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListVMMachineTypesResponse'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
          description: An unexpected error response.
      summary: List virtual machine types
      tags:
      - Virtual machines
  /v1/vms/machine-types-2:
    get:
      deprecated: true
      description: Lists all virtual machine types available.
      operationId: ListVMMachineTypes2
      parameters:
      - description: Return custom prices for a specific project.
        in: query
        name: projectId
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListVMMachineTypesResponse'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
          description: An unexpected error response.
      summary: Lists virtual machine types (deprecated)
      tags:
      - Virtual machines
components:
  schemas:
    ListVMMachineTypesResponse:
      properties:
        machineTypes:
          items:
            $ref: '#/components/schemas/VMMachineType'
          type: array
      required:
      - machineTypes
      type: object
    VM:
      properties:
        authorizedSshKeys:
          type: string
        bootDisk:
          $ref: '#/components/schemas/Disk'
        bootDiskSizeGib:
          format: int64
          type: integer
        commitmentEndTime:
          format: date-time
          readOnly: true
          type: string
        commitmentTerm:
          $ref: '#/components/schemas/CommitmentTerm'
        cpuModel:
          type: string
        createBy:
          readOnly: true
          type: string
        createTime:
          format: date-time
          readOnly: true
          type: string
        datacenterId:
          readOnly: true
          type: string
        expireTime:
          format: date-time
          readOnly: true
          type: string
        externalIpAddress:
          type: string
        gpuModel:
          type: string
        gpuModelId:
          type: string
        gpuQuantity:
          format: int64
          type: integer
        id:
          type: string
        imageId:
          type: string
        imageName:
          type: string
        internalIpAddress:
          type: string
        machineType:
          type: string
        memory:
          format: int64
          type: integer
        metadata:
          additionalProperties:
            type: string
          type: object
        nics:
          items:
            $ref: '#/components/schemas/VM.NIC'
          type: array
        price:
          $ref: '#/components/schemas/VMPrice'
        privateImageId:
          type: string
        projectId:
          type: string
        publicImageId:
          type: string
        publicImageName:
          type: string
        publicIpAddress:
          type: string
        renewableEnergy:
          type: boolean
        rules:
          items:
            $ref: '#/components/schemas/SecurityGroupRule'
          type: array
        securityGroupIds:
          items:
            type: string
          type: array
        securityGroups:
          items:
            $ref: '#/components/schemas/SecurityGroup'
          type: array
        shortState:
          type: string
        sshKeySource:
          $ref: '#/components/schemas/SshKeySource'
        state:
          $ref: '#/components/schemas/VmState'
        storageDisks:
          items:
            $ref: '#/components/schemas/Disk'
          type: array
        vcpus:
          format: int64
          type: integer
      required:
      - commitmentTerm
      - projectId
      type: object
    VMDataCenter:
      properties:
        diskPoolPricing:
          items:
            $ref: '#/components/schemas/DiskStoragePriceHr'
          type: array
        id:
          type: string
        ipv4Free:
          format: int32
          type: integer
        ipv4PriceHr:
          $ref: '#/components/schemas/Decimal'
        location:
          $ref: '#/components/schemas/LatLng'
        networkPriceHr:
          $ref: '#/components/schemas/Decimal'
        networkPricing:
          items:
            $ref: '#/components/schemas/NetworkPriceHr'
          type: array
        objectStorageGibPriceHr:
          $ref: '#/components/schemas/Decimal'
        renewableEnergy:
          type: boolean
        s3Endpoint:
          type: string
        supplierName:
          type: string
      required:
      - id
      - supplierName
      - renewableEnergy
      - ipv4Free
      - s3Endpoint
      - location
      type: object
    VMPrice:
      properties:
        gpuPriceHr:
          $ref: '#/components/schemas/Decimal'
        ipv4AddressPriceHr:
          $ref: '#/components/schemas/Decimal'
        memoryGibPriceHr:
          $ref: '#/components/schemas/Decimal'
        storageGibPriceHr:
          $ref: '#/components/schemas/Decimal'
        totalGpuPriceHr:
          $ref: '#/components/schemas/Decimal'
        totalMemoryPriceHr:
          $ref: '#/components/schemas/Decimal'
        totalPriceHr:
          $ref: '#/components/schemas/Decimal'
        totalStoragePriceHr:
          $ref: '#/components/schemas/Decimal'
        totalVcpuPriceHr:
          $ref: '#/components/schemas/Decimal'
        vcpuPriceHr:
          $ref: '#/components/schemas/Decimal'
      required:
      - vcpuPriceHr
      - totalVcpuPriceHr
      - memoryGibPriceHr
      - totalMemoryPriceHr
      - gpuPriceHr
      - totalGpuPriceHr
      - storageGibPriceHr
      - totalStoragePriceHr
      - ipv4AddressPriceHr
      - totalPriceHr
      type: object
    GpuModel:
      properties:
        id:
          type: string
        memoryGib:
          format: int32
          type: integer
        modelName:
          type: string
        vendorName:
          type: string
      required:
      - id
      - vendorName
      - modelName
      - memoryGib
      type: object
    DiskStoragePriceHr:
      properties:
        diskGibPriceHr:
          $ref: '#/components/schemas/Decimal'
      type: object
    SecurityGroupRule:
      properties:
        icmpType:
          type: string
        id:
          type: string
        ipRangeCidr:
          title: single IP or CIDR format range to apply rule to
          type: string
        ports:
          type: string
        protocol:
          $ref: '#/components/schemas/SecurityGroupRule.Protocol'
        ruleType:
          $ref: '#/components/schemas/SecurityGroupRule.RuleType'
      type: object
    SecurityGroupRule.Protocol:
      default: PROTOCOL_UNKNOWN
      enum:
      - PROTOCOL_UNKNOWN
      - PROTOCOL_ALL
      - PROTOCOL_TCP
