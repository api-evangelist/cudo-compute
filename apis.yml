name: CUDO Compute
kind: company
description: CUDO Compute is a global GPU and cloud compute platform and marketplace
  that provisions on-demand and reserved virtual machines, bare metal, and multi-node
  GPU clusters across a distributed network of data centers. Its versioned,
  resource-oriented REST API (with a parallel gRPC surface) lets developers create
  and manage virtual machines, machine types, data centers, disks, networks, images,
  SSH keys, object storage, and billing programmatically.
